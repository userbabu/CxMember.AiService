name: AI 中转服务部署
run-name: AI 中转服务部署 - ${{ gitea.sha }}

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ai-relay-deploy-${{ gitea.sha }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: cxerp-wsl-build
    steps:
      - name: 从内网 Gitea 检出代码
        env:
          RELEASE_SHA: ${{ gitea.sha }}
          GITEA_TOKEN: ${{ secrets.CX_REPO_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -eu
          test -n "${GITEA_TOKEN}"
          GIT_AUTH_HEADER="$(printf 'oauth2:%s' "${GITEA_TOKEN}" | base64 -w0)"
          rm -rf -- source
          git -c http.extraheader="Authorization: Basic ${GIT_AUTH_HEADER}" \
            clone --depth 1 --branch main \
            http://192.168.1.16:35362/cxruanjian/CxMember.AiService.git source
          git -C source checkout --detach "${RELEASE_SHA}"

      - name: 构建 AI 中转服务镜像
        working-directory: source
        env:
          IMAGE_TAG: ${{ gitea.sha }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/cx-ai-relay-${{ gitea.sha }}.tar.gz
        run: |
          set -eu
          docker version
          docker build --tag "cx-ai-relay:${IMAGE_TAG}" .
          docker save "cx-ai-relay:${IMAGE_TAG}" | gzip -1 > "${IMAGE_ARCHIVE}"

      - name: 通过内网 SSH 上传并部署
        working-directory: source
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/cx-ai-relay-${{ gitea.sha }}.tar.gz
          RELEASE_SHA: ${{ gitea.sha }}
          DATABASE_CREDENTIAL_FILE: /mnt/e/dev/dotnet/CxWebServer/env/credentials/cx-ai-relay-production.env
          SSH_KEY_SOURCE: /mnt/e/dev/dotnet/CxWebServer/env/credentials/47.119.166.45.key
          SSH_KEY_TEMP: ${{ runner.temp }}/cx-ai-relay-ssh-${{ gitea.sha }}.key
        run: |
          set -eu
          test -r "${SSH_KEY_SOURCE}"
          install -m 600 "${SSH_KEY_SOURCE}" "${SSH_KEY_TEMP}"
          export CXAI_DEPLOY_KEY="${SSH_KEY_TEMP}"
          trap 'rm -f -- "${SSH_KEY_TEMP}"' EXIT
          test -f "${DATABASE_CREDENTIAL_FILE}"
          test ! -L "${DATABASE_CREDENTIAL_FILE}"
          dsn_count="$(awk '/^DATABASE_DSN=/{count++} END {print count+0}' "${DATABASE_CREDENTIAL_FILE}")"
          test "${dsn_count}" -eq 1
          DATABASE_DSN="$(sed -n 's/^DATABASE_DSN=//p' "${DATABASE_CREDENTIAL_FILE}" | tr -d '\r')"
          test -n "${DATABASE_DSN}"
          printf '::add-mask::%s\n' "${DATABASE_DSN}"
          export DATABASE_DSN
          bash deploy/deploy-remote.sh
